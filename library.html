<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Library · The Kallah Club</title>
<meta name="description" content="Classes, books and resources chosen by Rabbanit Rachel Benchimol for kallahs and married women.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600&family=Herr+Von+Muellerhoff&family=Inter:wght@400;500;600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%23f7f4f0%27/%3E%3Cpath d=%27M16 5 27 16 16 27 5 16Z%27 fill=%27%23887289%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<style>
  .lib-intro { max-width: 56ch; margin: 6px auto 0; text-align: center; }
  .lib-jump { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 26px 0 8px; }
  .lib-jump a { font: 500 12px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--bluejean); text-decoration: none; padding: 8px 14px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); }
  .lib-jump a:hover { box-shadow: inset 0 0 0 1px var(--rose); }
  .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .res { background: var(--panel); border: 1px solid var(--line); padding: 24px 22px 20px; display: grid; gap: 8px; align-content: start; }
  .res .kind { font: 500 10.5px var(--body); letter-spacing: .2em; text-transform: uppercase; color: var(--copper-ink, #6f5a70); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .res h3 { font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.2; color: var(--bluejean); }
  .res .by { font-size: 14px; color: var(--muted); margin-top: -4px; }
  .res p { font-size: 15px; }
  .res .foot { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 6px; }
  .res .price { font-size: 13.5px; color: var(--espresso); }
  .members-cta { text-align: center; margin: 40px auto 0; max-width: 520px; }
</style>
</head>
<body>
<div id="bar"></div>
<main id="app">
  <div class="loading"><p class="script">The Kallah Club</p><p class="eyebrow dots">Opening the library</p></div>
</main>
<footer class="auth-foot"><div class="wrap app-foot">© 2026 The Kallah Club · With Rabbanit Rachel Benchimol</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="preview.js"></script>
<script src="app.js"></script>
<script>
/* The Library: classes, books and resources Rachel recommends.
   Open to everyone; members-only items appear after logging in (enforced by RLS). */
(function () {
  'use strict';
  var sb = KC.sb, h = KC.h;
  var app = document.getElementById('app');
  var SECTIONS = [
    ['class', 'Classes', 'Learn with Rachel'],
    ['book', 'Books', 'Rachel’s reading list'],
    ['app', 'Apps and tools', 'Helpful on your phone'],
    ['printable', 'Printables', 'Checklists and guides'],
    ['contact', 'Helpful contacts', 'Who to call'],
    ['link', 'More resources', 'Worth a look']
  ];
  var KIND = { 'class': 'Class', book: 'Book', app: 'App', printable: 'Printable', contact: 'Contact', link: 'Resource' };

  function publicBar() {
    return h('header', { class: 'topbar' }, h('div', { class: 'wrap topbar-in' },
      h('a', { class: 'brand', href: 'index.html' }, h('b', null, 'The Kallah'), h('i', null, 'Club')),
      h('nav', { class: 'toplinks', 'aria-label': 'Main' }, h('a', { href: 'index.html' }, 'Home'), h('a', { href: 'library.html', class: 'on' }, 'Library')),
      h('div', { class: 'me' }, h('a', { class: 'btn line small', href: 'account.html?next=course.html' }, 'Log in'))));
  }

  function card(r) {
    var host = '';
    try { host = r.url ? new URL(r.url).hostname.replace(/^www\./, '') : ''; } catch (e) {}
    var label = r.kind === 'class' ? 'Learn more' : r.kind === 'book' ? 'Get the book' : r.kind === 'contact' ? 'Visit' : 'Open';
    return h('article', { class: 'res' },
      h('span', { class: 'kind' }, KIND[r.kind] || 'Resource', r.members_only ? h('span', { class: 'tag admin' }, 'Members') : null),
      h('h3', null, r.title),
      r.author ? h('p', { class: 'by' }, r.author) : null,
      r.description ? h('p', null, r.description) : null,
      (r.url || r.price_note) ? h('div', { class: 'foot' },
        r.price_note ? h('span', { class: 'price' }, r.price_note) : h('span'),
        r.url ? h('a', { class: 'btn line small', href: r.url, target: '_blank', rel: 'noopener', 'aria-label': label + ': ' + r.title + (host ? ' (' + host + ')' : '') }, label) : null) : null);
  }

  (async function init() {
    var session = null, profile = null;
    try { session = await KC.getSession(); } catch (e) {}
    try { if (session) profile = await KC.getProfile(session.user); } catch (e) {}
    KC.clear(document.getElementById('bar')).appendChild(profile ? KC.topbar({ profile: profile, active: 'library' }) : publicBar());

    var r = await sb.from('resources').select('id, kind, title, author, description, url, price_note, members_only, published, position').eq('published', true).order('kind').order('position').order('id');
    var items = r.error ? [] : (r.data || []);
    var page = h('div', { class: 'wrap page' });
    page.appendChild(h('div', { class: 'page-title' }, h('p', { class: 'script' }, 'Chosen with care'), h('h1', { class: 'display' }, 'The Library')));
    page.appendChild(h('p', { class: 'lib-intro' }, 'Classes, books and tools Rachel recommends for kallahs and married women, to keep learning and growing long after the wedding.'));

    if (r.error) {
      page.appendChild(h('p', { class: 'empty' }, KC.friendlyError(r.error)));
    } else {
      var used = SECTIONS.filter(function (s) { return items.some(function (i) { return i.kind === s[0]; }); });
      if (used.length > 1) page.appendChild(h('nav', { class: 'lib-jump', 'aria-label': 'Library sections' }, used.map(function (s) { return h('a', { href: '#' + s[0] }, s[1]); })));
      if (!used.length) page.appendChild(h('p', { class: 'empty' }, h('span', { class: 'script' }, 'Coming soon'), 'Rachel is putting the library together.'));
      used.forEach(function (s) {
        page.appendChild(h('div', { class: 'section-head', id: s[0] }, h('p', { class: 'eyebrow' }, s[2]), h('h2', { class: 'display' }, s[1])));
        page.appendChild(h('div', { class: 'lib-grid' }, items.filter(function (i) { return i.kind === s[0]; }).map(card)));
      });
      if (!session) page.appendChild(h('div', { class: 'panel members-cta' },
        h('p', { class: 'script' }, 'Members'), h('p', null, 'Members see extra resources and printables here after logging in.'),
        h('a', { class: 'btn', href: 'account.html?next=course.html', style: 'margin-top:12px' }, 'Log in or join')));
    }
    KC.clear(app).appendChild(page);
    if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  })();
})();
</script>
</body>
</html>
